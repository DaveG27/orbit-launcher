plugins {
    id 'com.android.application'
}

// CI builds number themselves from the GitHub Actions run, so Tools → Update Orbit can tell a newer build.
def ciRun = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.orbit.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orbit.launcher'
        minSdk 22          // Fire OS 5 and up
        targetSdk 35
        versionCode 100 + ciRun
        versionName "0.4.${ciRun}"
    }

    // One fixed key so every build installs over the last one.
    // Move these to GitHub secrets before sharing the app with anyone else.
    signingConfigs {
        orbit {
            storeFile file('orbit.jks')
            storePassword 'orbit-launcher'
            keyAlias 'orbit'
            keyPassword 'orbit-launcher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.orbit
        }
        debug {
            signingConfig signingConfigs.orbit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
